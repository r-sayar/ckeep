<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
<meta name="description" content="A fast, offline-first note app." />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<title>Keep</title>
<script>
  /* Synchronous bootstrap. Runs before CSS paints so there is never a flash of
     the wrong theme or the wrong screen.
       1. theme  -> <html class="dark">
       2. auth   -> <html class="authed"> or <html class="unauth">
     Supabase stores its session in localStorage either as raw JSON or, since
     supabase-js 2.43, as "base64-<base64url payload>". Handle both. */
  (function () {
    var H = document.documentElement;

    try {
      var t = localStorage.getItem("keep_theme") || "system";
      var dark = t === "dark" || (t === "system" &&
        window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) H.classList.add("dark");
    } catch (e) {}

    try {
      var v = localStorage.getItem("keep_view");
      if (v === "list") H.classList.add("list-view");
    } catch (e) {}

    try {
      var raw = localStorage.getItem("sb-sywglobxvtxayvelhunb-auth-token");
      if (raw && raw.indexOf("base64-") === 0) {
        var b = raw.slice(7).replace(/-/g, "+").replace(/_/g, "/");
        var bin = atob(b);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        raw = new TextDecoder().decode(bytes);
      }
      var sess = raw ? JSON.parse(raw) : null;
      if (sess && sess.user && sess.user.id) {
        H.classList.add("authed");
        window.__BOOT_USER = sess.user;
      } else {
        H.classList.add("unauth");
      }
    } catch (e) {
      H.classList.add("unauth");
    }
  })();
</script>
<link rel="stylesheet" href="/app.css" />
</head>
<body>

<!-- ══ Sign in ══ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><span class="k">Ke</span><span class="e">e</span><span class="k">p</span></div>
    <p>Sign in with your email and we'll send you a one-tap link. No password.</p>
    <form id="auth-form">
      <input id="email" type="email" placeholder="you@example.com" required autocomplete="email" />
      <button type="submit" id="auth-submit">Send login link</button>
    </form>
    <div id="auth-msg" class="auth-msg"></div>
  </div>
</div>

<!-- ══ Top app bar ══ -->
<header id="topbar">
  <button class="icon-btn" id="menu-btn" title="Main menu" aria-label="Main menu"></button>
  <div class="brand"><span class="mark"></span><span class="word">Keep</span></div>

  <div class="search-shell">
    <div class="search-box">
      <button class="icon-btn search-ico" id="search-btn" tabindex="-1" aria-hidden="true"></button>
      <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
      <button class="icon-btn search-clear" id="search-clear" hidden title="Clear search"></button>
    </div>
  </div>

  <div class="bar-actions">
    <button class="icon-btn" id="refresh-btn" title="Refresh"></button>
    <button class="icon-btn" id="view-btn" title="Toggle list view"></button>
    <button class="icon-btn" id="theme-btn" title="Toggle theme"></button>
    <button class="icon-btn avatar" id="account-btn" title="Account"></button>
  </div>
</header>

<!-- ══ Selection bar (replaces the top bar when notes are selected) ══ -->
<div id="selbar" hidden>
  <button class="icon-btn" id="sel-close" title="Clear selection"></button>
  <span id="sel-count">0 selected</span>
  <div class="bar-actions">
    <button class="icon-btn" id="sel-pin" title="Pin"></button>
    <button class="icon-btn" id="sel-color" title="Change color"></button>
    <button class="icon-btn" id="sel-label" title="Labels"></button>
    <button class="icon-btn" id="sel-archive" title="Archive"></button>
    <button class="icon-btn" id="sel-delete" title="Delete"></button>
  </div>
</div>

<!-- ══ Navigation drawer ══ -->
<div id="scrim"></div>
<nav id="sidebar" aria-label="Views"><div id="nav-list"></div></nav>

<!-- ══ Notes ══ -->
<main id="main">
  <div id="composer-wrap">
    <div id="composer" class="collapsed">
      <div class="cmp-collapsed">
        <input id="cmp-stub" placeholder="Take a note…" readonly />
        <div class="cmp-stub-actions">
          <button class="icon-btn" id="cmp-new-list" title="New list"></button>
        </div>
      </div>
      <div class="cmp-open">
        <input id="cmp-title" placeholder="Title" />
        <textarea id="cmp-body" placeholder="Take a note…" rows="1"></textarea>
        <ul id="cmp-list" class="checklist edit" hidden></ul>
        <div id="cmp-labels" class="chips"></div>
        <div class="cmp-actions">
          <div class="left">
            <button class="icon-btn" data-cmp="color" title="Background options"></button>
            <button class="icon-btn" data-cmp="label" title="Add label"></button>
            <button class="icon-btn" data-cmp="check" title="Show checkboxes"></button>
            <button class="icon-btn" data-cmp="pin" title="Pin note"></button>
          </div>
          <button class="text-btn" data-cmp="close">Close</button>
        </div>
      </div>
    </div>
  </div>

  <section class="grid-section" id="sec-pinned" hidden>
    <h2 class="section-label">Pinned</h2>
    <div class="grid" id="grid-pinned"></div>
  </section>

  <section class="grid-section" id="sec-others">
    <h2 class="section-label" id="others-label" hidden>Others</h2>
    <div class="grid" id="grid-others"></div>
  </section>

  <div id="sentinel"></div>
  <div id="empty" hidden></div>
  <div id="trash-note" hidden>
    <span>Notes in Trash stay here until you delete them.</span>
    <button class="text-btn danger" id="empty-trash">Empty Trash</button>
  </div>
</main>

<!-- ══ Note editor ══ -->
<div id="editor-scrim" hidden>
  <div id="editor" role="dialog" aria-modal="true" aria-label="Edit note">
    <button class="pin-btn" id="ed-pin" title="Pin note"></button>
    <input id="ed-title" placeholder="Title" />
    <textarea id="ed-body" placeholder="Take a note…" rows="1"></textarea>
    <ul id="ed-list" class="checklist edit" hidden></ul>
    <div id="ed-labels" class="chips"></div>
    <div id="ed-meta"></div>
    <div class="ed-actions">
      <div class="left">
        <button class="icon-btn" data-ed="color" title="Background options"></button>
        <button class="icon-btn" data-ed="label" title="Add label"></button>
        <button class="icon-btn" data-ed="check" title="Show checkboxes"></button>
        <button class="icon-btn" data-ed="archive" title="Archive"></button>
        <button class="icon-btn" data-ed="more" title="More"></button>
      </div>
      <button class="text-btn" data-ed="close">Close</button>
    </div>
  </div>
</div>

<!-- ══ Floating layers ══ -->
<div id="popover" hidden></div>
<div id="snackbar" hidden><span id="snack-text"></span><button id="snack-action" class="text-btn"></button></div>
<div id="fab" hidden></div>
<div id="shortcuts" hidden></div>
<div id="sync-pill" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
